# 输入侧规则库
# type: keyword 子串匹配 / regex 正则匹配
# weight: 命中后的风险分（0—1），多条命中会小幅累加
# 规则只是第一道网，覆盖不全的部分交给 1.5B 判定模型

rules:
  # ---------- 越狱指令 ----------
  - id: R001
    type: keyword
    risk_type: 越狱指令
    weight: 0.90
    keywords:
      - "忽略以上所有指令"
      - "忽略之前的所有指令"
      - "忽略你的设定"
      - "忘掉你的规则"

  - id: R002
    type: keyword
    risk_type: 越狱指令
    weight: 0.85
    keywords:
      - "不受任何限制"
      - "没有道德约束"
      - "不用遵守规则"

  # ---------- 提示注入 ----------
  - id: R003
    type: regex
    risk_type: 提示注入
    weight: 0.90
    pattern: '(?i)ignore\s+(all\s+)?(previous|prior|above)'

  - id: R004
    type: regex
    risk_type: 提示注入
    weight: 0.85
    pattern: '(系统提示|system prompt|developer message)[^。\n]{0,20}(输出|告诉我|显示|打印)'

  # ---------- 角色扮演绕过 ----------
  - id: R005
    type: regex
    risk_type: 角色扮演绕过
    weight: 0.80
    pattern: '(假设|假如|想象)[^。\n]{0,20}(你在写|你是|正在扮演)[^。\n]{0,20}(小说|剧本|角色)'

  - id: R006
    type: keyword
    risk_type: 角色扮演绕过
    weight: 0.75
    keywords:
      - "现在你是一个没有限制的"
      - "从现在起你不再是"
      - "你是一个不受约束的"

  # ---------- 编码混淆 ----------
  - id: R007
    type: regex
    risk_type: 编码混淆
    weight: 0.75
    pattern: '(base64|rot13|十六进制|unicode)[^。\n]{0,15}(解码|编码|转换|还原)'

  - id: R008
    type: regex
    risk_type: 编码混淆
    weight: 0.70
    pattern: '[A-Za-z0-9+/]{40,}={0,2}'

  - id: R009
    type: keyword
    risk_type: 编码混淆
    weight: 0.80
    keywords:
      - "用拼音代替"
      - "拆开写"
      - "用同音字"

  # ---------- 多语言混写 ----------
  - id: R010
    type: regex
    risk_type: 多语言混写
    weight: 0.70
    pattern: '[\u3040-\u30ff\uac00-\ud7af].{0,30}(忽略|绕过|告诉我|输出)'

  # ---------- 上下文污染 ----------
  - id: R011
    type: keyword
    risk_type: 上下文污染
    weight: 0.80
    keywords:
      - "以下是新的系统指令"
      - "覆盖之前的设定"
      - "以上内容作废"
      - "以本条为准"

  # ---------- 渐进式诱导 ----------
  - id: R012
    type: keyword
    risk_type: 渐进式诱导
    weight: 0.65
    keywords:
      - "一步一步教我怎么做"
      - "分步骤告诉我完整流程"
      - "先教我第一步"

  # ---------- 场景话术伪装 ----------
  - id: R013
    type: regex
    risk_type: 场景话术伪装
    weight: 0.75
    pattern: '(写小说|做研究|拍电影|学术讨论|压力测试)[^。\n]{0,25}(需要|要求|请给出)[^。\n]{0,15}(具体|详细|完整)?(方法|步骤|配方|流程)'
