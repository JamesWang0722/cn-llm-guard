# 输出侧规则库
# 与输入侧分开维护：输入侧判意图，输出侧判结果
# 个人信息由 output_guard.py 内置正则处理，不在此重复配置

rules:
  - id: O001
    risk_type: 误导性表述
    keywords:
      - "保证收益"
      - "稳赚不赔"
      - "绝对安全"
      - "百分百有效"

  - id: O002
    risk_type: 危险操作指引
    keywords:
      - "具体配比"
      - "详细步骤如下"
      - "所需材料清单"
      - "操作顺序为"

  - id: O003
    risk_type: 绝对化表述
    keywords:
      - "一定能"
      - "绝对不会"
      - "永远有效"

  - id: O004
    risk_type: 越权承诺
    keywords:
      - "我可以帮你删除"
      - "我已经修改了"
      - "已为你提交"
