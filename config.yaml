# 本地模型配置
llm:
  provider: ollama
  base_url: http://127.0.0.1:11434
  # 主模型：负责生成回答（本机已有 qwen3:4b，先用它）
  chat_model: qwen3:4b
  # 判定模型：负责风险分类，零样本（qwen3 关不掉 thinking，判定必须用 qwen2.5）
  judge_model: qwen2.5:1.5b-instruct
  timeout_seconds: 60

# 检测阈值
detection:
  # 是否启用 1.5B 判定模型；阶段 1 纯规则调试时设为 false
  enable_model_judge: true
  # 模型判定的风险分阈值，超过即拦截
  block_threshold: 0.70
  # 规则与模型的融合方式：or（任一判恶即拦） / and（两者都判恶才拦）
  fusion_mode: or
  # 单条输入最大长度，超长直接拒绝，防注入填充
  max_input_chars: 4000
  # 判定模型超时后是否放行
  fail_open: true

# 存储
storage:
  db_path: data/guard.db

# 评测
eval:
  report_dir: reports
  # 延迟统计分位
  latency_percentile: 95
